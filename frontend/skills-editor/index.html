<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>InterClaw Skill Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css">

<!-- ═══ 1. ISC Design Tokens (extracted from interop-editor/rule-editor builds) ═══ -->
<style>
:root {
  --fr-styles-color-primary-hsl: 238, 49%, 39%;
  --fr-styles-color-primary: hsl(238, 49%, 39%);
  --fr-styles-color-primary-contrast: hsl(0, 0%, 100%);
  --fr-styles-color-secondary-hsl: 178, 100%, 32%;
  --fr-styles-color-secondary: hsl(178, 100%, 32%);
  --fr-styles-color-secondary-contrast: hsl(0, 0%, 100%);
  --fr-styles-color-accent: hsl(178, 41%, 82%);
  --fr-styles-color-white: hsl(0, 0%, 100%);
  --fr-styles-color-near-white: hsl(0, 0%, 98%);
  --fr-styles-color-very-light-grey: hsl(0, 0%, 95%);
  --fr-styles-color-light-grey: hsl(0, 0%, 88%);
  --fr-styles-color-middle-grey: hsl(0, 0%, 80%);
  --fr-styles-color-middle-dark-grey: hsl(0, 0%, 69%);
  --fr-styles-color-dark-grey: hsl(0, 0%, 57%);
  --fr-styles-color-very-dark-grey: hsl(0, 0%, 39%);
  --fr-styles-color-near-black: hsl(0, 0%, 17%);
  --fr-styles-color-warning: hsl(0, 97%, 43%);
  --fr-styles-color-state-focused: hsl(178, 100%, 28%);
  --fr-styles-color-state-focused-high-contrast: hsl(178, 100%, 25%);
  --fr-styles-color-state-disabled: hsl(0, 0%, 60%);
  --fr-styles-font-size-3xs: 0.6875rem;
  --fr-styles-font-size-2xs: 0.75rem;
  --fr-styles-font-size-xs: 0.8125rem;
  --fr-styles-font-size-sm: 0.875rem;
  --fr-styles-font-size-base: 1rem;
  --fr-header-height-toolbar: 40px;
  --fr-header-border-top-toolbar: 4px;
  --chatbot-width: 25vw;
}

/* ISC Font (local files from rule-editor — same as interop-editor) */
@font-face {
  font-family: 'Noto Sans'; font-style: normal; font-weight: 400;
  src: local('Noto Sans'), local('NotoSans'),
       url(../noto-sans-v9-latin-regular.dbdd323d86bb9df6.woff2) format('woff2');
}
@font-face {
  font-family: 'Noto Sans'; font-style: normal; font-weight: 700;
  src: local('Noto Sans Bold'), local('NotoSans-Bold'),
       url(../noto-sans-v9-latin-700.2813ebf28ffdbb0b.woff2) format('woff2');
}
</style>

<!-- ═══ 2. Chatbot layout (identical to interop-editor line 10) ═══ -->
<style>
html { --chatbot-width: 25vw; }
#app-root {
  position: absolute;
  top: 0; bottom: 0; left: 0;
  right: var(--chatbot-width) !important;
  transform: translateZ(0);
}
body.chatbot-auth-gate #chatbot-sidebar,
body.chatbot-auth-gate #chatbot-toggle { display: none !important; }
body.chatbot-auth-gate #app-root { right: 0 !important; transition: none !important; }
</style>

<!-- ═══ 3. Skills Editor styles (ISC Material Design tokens) ═══ -->
<style>
/* ── Reset (matches interop-editor) ────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: 'Noto Sans', 'Noto Sans Arabic', Arial, sans-serif;
  font-size: var(--fr-styles-font-size-sm);
  color: rgba(0,0,0,0.87);
  background: var(--fr-styles-color-near-white);
}

/* ── App Layout ─────────────────────────────────── */
#app-root {
  position: absolute;
  inset: 0;
  display: flex; flex-direction: column; overflow: hidden;
}

/* ── Toolbar (chatbot-style) ───────────────────── */
#toolbar {
  height: 40px;
  background: var(--fr-styles-color-white);
  display: flex; align-items: center;
  padding: 0 16px; gap: 12px;
  flex-shrink: 0;
  border-top: 2px solid var(--fr-styles-color-primary);
  border-bottom: 1px solid rgba(0,0,0,.1215686275);
  z-index: 10;
}
.brand {
  font-weight: 600; font-size: var(--fr-styles-font-size-sm);
  color: var(--fr-styles-color-primary);
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.brand svg { width: 16px; height: 16px; fill: currentColor; }
.breadcrumb {
  font-size: var(--fr-styles-font-size-xs); color: rgba(0,0,0,0.54);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
}
.breadcrumb .sep { color: rgba(0,0,0,0.26); margin: 0 3px; }
.breadcrumb .current { color: rgba(0,0,0,0.87); font-weight: 600; }
.toolbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.view-toggle {
  display: none; gap: 1px;
  background: var(--fr-styles-color-very-light-grey); border-radius: 4px; padding: 2px;
}
.view-toggle.visible { display: flex; }
.view-toggle button {
  border: none; background: none; padding: 3px 10px; border-radius: 3px;
  cursor: pointer; font-family: inherit; font-size: var(--fr-styles-font-size-2xs); font-weight: 500;
  color: rgba(0,0,0,0.54); transition: all 0.15s ease;
}
.view-toggle button.active {
  background: var(--fr-styles-color-white); color: rgba(0,0,0,0.87);
  box-shadow: 0 1px 2px rgba(0,0,0,0.12);
}
.view-toggle button:hover:not(.active) { color: rgba(0,0,0,0.87); }

/* ── Main ───────────────────────────────────────── */
#main { flex: 1; display: flex; overflow: hidden; }

/* ── Sidebar (chatbot-style) ───────────────────── */
#sidebar {
  width: 280px; min-width: 200px; max-width: 420px;
  background: var(--fr-styles-color-white);
  border-right: none;
  display: flex; flex-direction: column;
  overflow: hidden; flex-shrink: 0;
  position: relative;
}
#sidebar::after {
  content: ''; position: absolute; right: 0; top: 0; bottom: 0;
  width: 1px; background: var(--fr-styles-color-light-grey);
  pointer-events: none;
}
#sidebar-search { padding: 8px 12px; flex-shrink: 0; }
#sidebar-search input {
  width: 100%; padding: 5px 10px;
  border: 1px solid rgba(0,0,0,0.38); border-radius: 4px;
  font-family: inherit; font-size: var(--fr-styles-font-size-2xs);
  color: rgba(0,0,0,0.87); background: var(--fr-styles-color-white); outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
#sidebar-search input::placeholder { color: rgba(0,0,0,0.38); }
#sidebar-search input:focus {
  border-color: var(--fr-styles-color-secondary);
  box-shadow: 0 0 0 1px var(--fr-styles-color-secondary);
}
#sidebar-content { flex: 1; overflow-y: auto; padding-bottom: 8px; }
#sidebar-content::-webkit-scrollbar { width: 4px; }
#sidebar-content::-webkit-scrollbar-track { background: transparent; }
#sidebar-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
#sidebar-content::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.26); }

/* ── Section ────────────────────────────────────── */
.section { margin-bottom: 0; }
.section-header {
  display: flex; align-items: center;
  padding: 6px 12px; cursor: pointer; user-select: none;
  transition: background 0.1s;
}
.section-header:hover { background: rgba(0,0,0,0.04); }
.section-chevron {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: rgba(0,0,0,0.54);
  transition: transform 0.15s ease;
}
.section-chevron.collapsed { transform: rotate(-90deg); }
.section-chevron svg { width: 10px; height: 10px; }
.section-icon {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-left: 2px; color: rgba(0,0,0,0.54);
}
.section-icon svg { width: 14px; height: 14px; }
.section-label {
  font-size: var(--fr-styles-font-size-2xs); font-weight: 600; color: rgba(0,0,0,0.54);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-left: 6px; flex: 1;
}
.section-count {
  font-size: var(--fr-styles-font-size-3xs); color: rgba(0,0,0,0.38);
}
.section-items { overflow: hidden; }
.section-items.collapsed { display: none; }

/* ── Group (sub-section in References/Templates) ── */
.group-header {
  display: flex; align-items: center;
  padding: 4px 12px 4px 24px; cursor: pointer; user-select: none;
  transition: background 0.1s;
}
.group-header:hover { background: rgba(0,0,0,0.04); }
.group-chevron {
  width: 14px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: rgba(0,0,0,0.38);
  transition: transform 0.15s ease;
}
.group-chevron.collapsed { transform: rotate(-90deg); }
.group-chevron svg { width: 8px; height: 8px; }
.group-label {
  font-size: var(--fr-styles-font-size-2xs); font-weight: 500; color: rgba(0,0,0,0.54);
  margin-left: 4px; flex: 1;
}
.group-count { font-size: var(--fr-styles-font-size-3xs); color: rgba(0,0,0,0.38); }
.group-items.collapsed { display: none; }

/* ── File item ──────────────────────────────────── */
.file-item {
  display: flex; align-items: center;
  padding: 3px 12px 3px 38px; cursor: pointer; user-select: none;
  gap: 6px; white-space: nowrap;
  transition: background 0.1s;
}
/* padding-left set dynamically by JS based on depth */
.file-item:hover { background: rgba(0,0,0,0.04); }
.file-item.active {
  background: rgba(0,0,0,0.06);
}
.file-item.active .file-name { font-weight: 600; }
.file-item.root-file .file-name { font-weight: 600; }

.file-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; flex-shrink: 0;
}
.file-icon svg { width: 16px; height: 16px; }
.file-icon.py,
.file-icon.md,
.file-icon.json,
.file-icon.js,
.file-icon.sh,
.file-icon.cls,
.file-icon.cos,
.file-icon.tpl,
.file-icon.html,
.file-icon.css,
.file-icon.xml,
.file-icon.yml,
.file-icon.toml,
.file-icon.cfg,
.file-icon.txt,
.file-icon.default { color: rgba(0,0,0,0.38); }
.file-name {
  font-size: var(--fr-styles-font-size-2xs); color: rgba(0,0,0,0.87);
  overflow: hidden; text-overflow: ellipsis;
}
.override-badge {
  font-size: 9px; font-weight: 600;
  color: hsl(27, 96%, 50%);
  background: hsla(27, 96%, 50%, 0.08);
  padding: 0 4px; border-radius: 3px;
  margin-left: auto; flex-shrink: 0; line-height: 16px;
}
.search-empty {
  padding: 24px; text-align: center;
  color: rgba(0,0,0,0.38); font-size: var(--fr-styles-font-size-2xs);
}

/* ── Resize handle (inside sidebar, right edge — chatbot pattern) ── */
#resize-handle {
  position: absolute; right: 0; top: 0; bottom: 0; width: 6px;
  cursor: col-resize; z-index: 2;
  background: transparent;
  transition: background 0.15s ease;
}
#resize-handle::after {
  content: ''; position: absolute; right: 2px; top: 50%;
  transform: translateY(-50%); width: 2px; height: 32px;
  border-radius: 1px; background: transparent;
  transition: background 0.15s ease, height 0.15s ease;
}
#resize-handle:hover::after {
  background: var(--fr-styles-color-middle-grey); height: 48px;
}
#resize-handle.active::after {
  background: var(--fr-styles-color-dark-grey); height: 48px;
}

/* ── Content panel (chatbot-aligned) ───────────── */
#content {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; background: white;
  min-width: 0; max-width: 100%; width: 0;
}
#content ::-webkit-scrollbar { width: 4px; height: 4px; }
#content ::-webkit-scrollbar-track { background: transparent; }
#content ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
#content ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }

/* ── Code header ────────────────────────────────── */
#code-header {
  padding: 8px 16px;
  border-bottom: 1px solid rgba(0,0,0,0.12);
  display: none; align-items: center; gap: 10px; flex-shrink: 0;
  background: var(--fr-styles-color-white);
}
#code-header .filename { font-weight: 600; font-size: var(--fr-styles-font-size-sm); color: rgba(0,0,0,0.87); }
#code-header .lang-badge {
  font-size: var(--fr-styles-font-size-3xs); font-weight: 600; padding: 1px 6px; border-radius: 3px;
  background: var(--fr-styles-color-very-light-grey); color: rgba(0,0,0,0.54);
  text-transform: uppercase;
}
#code-header .meta { font-size: var(--fr-styles-font-size-2xs); color: rgba(0,0,0,0.38); }

/* ── Source Editor (editable textarea — chatbot-aligned) ── */
#source-editor {
  flex: 1; display: none;
  border: none; outline: none; resize: none;
  padding: 16px 24px;
  font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
  font-size: 13px; line-height: 1.6; tab-size: 4;
  color: rgba(0,0,0,0.87);
  background: white;
  white-space: pre-wrap; overflow: auto;
  width: 100%; min-width: 0; max-width: 100%;
  overflow-wrap: break-word; word-wrap: break-word;
}
#source-editor::placeholder { color: rgba(0,0,0,0.38); }

/* ── Highlighted code view (Prism, chatbot-aligned) */
#code-view {
  flex: 1; display: none;
  margin: 0; overflow: auto;
  min-width: 0; max-width: 100%;
  background: white;
  font-size: 13px !important;
  overflow-wrap: break-word; word-wrap: break-word;
}
#code-view code {
  font-family: 'Consolas', 'Monaco', 'Courier New', monospace !important;
  font-size: 13px !important;
  line-height: 1.6 !important;
  white-space: pre-wrap !important;
  overflow-wrap: break-word; word-wrap: break-word;
}

/* ── Markdown view (Linear-style) ──────────────────── */
#markdown-view {
  flex: 1; overflow: auto;
  padding: 40px 48px; display: none;
  line-height: 1.6; font-size: 14px;
  min-width: 0; max-width: 100%;
  overflow-wrap: break-word; word-wrap: break-word;
  background: #fff;
  color: #3c4149;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#markdown-view > * { max-width: 100%; }
#markdown-view h1 {
  font-size: 1.5em; margin: 1.5em 0 0.5em; font-weight: 600;
  color: #1b1e23; letter-spacing: -0.02em; line-height: 1.3;
}
#markdown-view h1:first-child { margin-top: 0; }
#markdown-view h2 {
  font-size: 1.25em; margin: 1.5em 0 0.4em; font-weight: 600;
  color: #1b1e23; letter-spacing: -0.01em; line-height: 1.3;
}
#markdown-view h3 {
  font-size: 1em; margin: 1.25em 0 0.35em; font-weight: 600;
  color: #3c4149;
}
#markdown-view h4 {
  font-size: 0.875em; margin: 1em 0 0.25em; font-weight: 600;
  color: #6b6f76;
}
#markdown-view p { margin: 0.75em 0; }
#markdown-view code {
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 0.85em; background: #f2f3f5;
  padding: 1px 5px; border-radius: 3px;
  color: #3c4149;
}
#markdown-view pre {
  background: #f2f3f5;
  border-radius: 6px; padding: 14px 16px;
  overflow-x: auto; margin: 1em 0;
}
#markdown-view pre code {
  background: none; padding: 0; color: #3c4149;
  font-size: 13px; line-height: 1.5;
  white-space: pre; overflow-wrap: normal;
}
#markdown-view ul, #markdown-view ol { padding-left: 1.5em; margin: 0.5em 0; }
#markdown-view li { margin: 0.2em 0; }
#markdown-view li > ul, #markdown-view li > ol { margin: 0.1em 0; }
#markdown-view table {
  border-collapse: collapse;
  margin: 1em 0; width: auto;
  max-width: 100%; display: block; overflow-x: auto;
}
#markdown-view th, #markdown-view td {
  border: 1px solid #e1e4e8;
  padding: 6px 12px;
  text-align: left; font-size: 13px;
}
#markdown-view th {
  background: #f6f8fa; font-weight: 600; color: #3c4149;
}
#markdown-view blockquote {
  border-left: 3px solid #d8dbe0; padding: 0 16px;
  margin: 1em 0; color: #6b6f76;
}
#markdown-view blockquote p { margin: 0.4em 0; }
#markdown-view a { color: #5e6ad2; text-decoration: none; }
#markdown-view a:hover { text-decoration: underline; }
#markdown-view hr {
  border: none; height: 1px; background: #e1e4e8;
  margin: 2em 0;
}
#markdown-view strong { font-weight: 600; color: #1b1e23; }
#markdown-view img { max-width: 100%; height: auto; }

/* ── Frontmatter metadata block ───────────────── */
.frontmatter-block {
  margin: 0 0 1.5em; padding: 14px 18px;
  background: #f8f9fb; border: 1px solid #e8eaed;
  border-radius: 8px; font-size: 13px;
  line-height: 1.65; color: #555;
}
.frontmatter-block .fm-row {
  display: flex; gap: 8px; padding: 2px 0;
}
.frontmatter-block .fm-key {
  font-weight: 600; color: #6e7681;
  min-width: 100px; flex-shrink: 0;
  font-family: 'SF Mono', 'Consolas', 'Monaco', 'Menlo', monospace;
  font-size: 12px;
}
.frontmatter-block .fm-val {
  color: #1d1d1f;
}

/* ── Empty State (chatbot-style centered logo) ──── */
#welcome {
  flex: 1;
  background: white;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
  padding: 32px;
}
.welcome-icon {
  width: 48px; height: 48px; opacity: 0.15;
}
.welcome-icon svg { width: 100%; height: 100%; }
.welcome-title {
  font-size: var(--fr-styles-font-size-sm);
  color: rgba(0,0,0,0.38);
  font-weight: 500;
  text-align: center;
}
.welcome-hint {
  font-size: var(--fr-styles-font-size-2xs);
  color: rgba(0,0,0,0.26);
  text-align: center;
  max-width: 320px;
  line-height: 1.6;
}
.welcome-hint .chatbot-ref {
  font-weight: 600;
}
/* ── Status Indicator ──────────────────────────── */
.status-indicator {
  font-size: var(--fr-styles-font-size-2xs);
  color: rgba(0,0,0,0.54);
  display: flex; align-items: center; gap: 5px;
  flex-shrink: 0; white-space: nowrap;
}
.status-indicator .dot {
  width: 6px; height: 6px; border-radius: 50%; display: inline-block;
}
.status-indicator .dot.saved { background: hsl(152, 69%, 53%); }
.status-indicator .dot.saving { background: hsl(45, 93%, 47%); animation: pulse-save 1s ease-in-out infinite; }
.status-indicator .dot.modified { background: hsl(27, 96%, 61%); }
.status-indicator .dot.refreshed { background: hsl(142, 71%, 45%); }
@keyframes pulse-save { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

/* ── Modified Badge (ISC Teal #00B2A9) ─────────── */
.modified-badge {
  font-size: 9px; font-weight: 600;
  color: #00B2A9;
  background: rgba(0, 178, 169, 0.08);
  padding: 0 4px; border-radius: 3px;
  margin-left: auto; flex-shrink: 0; line-height: 16px;
}

/* ── Removed file/folder coloring (ISC Blue #2F2A95) */
.removed-badge {
  font-size: 9px; font-weight: 600;
  color: #2F2A95;
  background: rgba(47, 42, 149, 0.08);
  padding: 0 4px; border-radius: 3px;
  margin-left: auto; flex-shrink: 0; line-height: 16px;
}
.file-item.removed .file-name {
  color: #2F2A95;
  text-decoration: line-through;
  opacity: 0.7;
}
.file-item.removed .file-icon {
  color: #2F2A95;
  opacity: 0.7;
}
.group-header.removed .group-label {
  color: #2F2A95;
  text-decoration: line-through;
  opacity: 0.7;
}
.group-header.removed .group-chevron,
.group-header.removed .group-count {
  color: #2F2A95;
  opacity: 0.7;
}

/* ── Modified file coloring (ISC Teal) ─────────── */
.file-item.modified .file-name {
  color: #00B2A9;
  font-weight: 600;
}
.file-item.modified .file-icon {
  color: #00B2A9;
}

/* ── Custom folder/section coloring (teal) ─────── */
.group-header.custom .group-label,
.group-header.custom .group-chevron,
.group-header.custom .group-count {
  color: var(--fr-styles-color-state-focused);
}
.group-header.custom .group-label { font-weight: 600; }
.section-header.custom .section-label,
.section-header.custom .section-chevron,
.section-header.custom .section-icon,
.section-header.custom .section-count {
  color: var(--fr-styles-color-state-focused);
}
.section-header.custom .section-label { font-weight: 700; }
.file-item.custom .file-name {
  color: var(--fr-styles-color-state-focused);
}
.file-item.custom .file-icon {
  color: var(--fr-styles-color-state-focused);
}

/* ── Restore Button ────────────────────────────── */
.restore-btn {
  display: none;
  border: 1px solid rgba(0,0,0,0.12); background: none;
  border-radius: 3px; padding: 2px 8px;
  font-family: inherit; font-size: var(--fr-styles-font-size-2xs);
  color: rgba(0,0,0,0.54); cursor: pointer;
  transition: all 0.15s;
}
.restore-btn:hover {
  background: rgba(0,0,0,0.04);
  color: rgba(0,0,0,0.87);

<script>
(function() {

  var _contentCache = {};

  var state = {

    currentFileData: null,

    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';

  var _docLines = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M4 1.5h5l3.5 3.5V14.5H4z"/><path d="M9 1.5V5h3.5"/><path stroke-linecap="round" stroke-width="1" d="M6 7.5h5M6 10h4M6 12.5h3"/></svg>';
  var _code = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5L1.5 8 5 12.5"/><path d="M11 3.5l3.5 4.5-3.5 4.5"/></svg>';

  };
  function fileIconClass(ext) {

    return { cls: cls, svg: ICON_SVGS[cls] || ICON_SVGS['default'] };

  /* ── Prism language map ──────────────────────────────────────────── */
  var PRISM_LANG = {
    python:'python', json:'json', javascript:'javascript', bash:'bash',
    yaml:'yaml', css:'css', html:'markup', xml:'markup', markdown:'markdown',

  var EXT_LANG = {
    '.md':'markdown', '.py':'python', '.json':'json', '.js':'javascript',
    '.sh':'bash', '.yaml':'yaml', '.yml':'yaml', '.html':'html', '.css':'css',

  /* ── Load index.json ────────────────────────────────────────────────── */
  function loadIndex() {
    fetch(_apiBase + '/api/skill-index?t=' + Date.now()).then(function(r) { return r.json(); })
    .then(function(entries) {
      state.manifest = entries;
      state.files = entries.sort(function(a, b) { return a.path.localeCompare(b.path); });

      var node = root;
      for (var i = 0; i < parts.length - 1; i++) {
        if (!node._dirs[parts[i]]) node._dirs[parts[i]] = { _files: [], _dirs: {} };
        node = node._dirs[parts[i]];
      }
      node._files.push(e);
    });
    return root;
  }

  /* ── Render sidebar (tree) ─────────────────────────────────────────── */
  function renderSidebar(filter) {
    var container = $('#sidebar-content');
    var scrollTop = container.scrollTop;
    container.innerHTML = '';
    if (!state.tree) return;

    var q = (filter || '').toLowerCase();

    // Root-level files first
    state.tree._files.forEach(function(f) {

      var el = buildFileItem(f, 0);
      el.classList.add('root-file');
      container.appendChild(el);
    });

    // Then directories
    Object.keys(state.tree._dirs).sort().forEach(function(dirName) {
      renderDir(container, dirName, state.tree._dirs[dirName], dirName, 0, q);

      container.innerHTML = '<div class="search-empty">No matching files</div>';

  }

  function renderDir(parent, name, node, fullPath, depth, filter) {
    // Collect all files under this dir for filtering
    var allFiles = collectFiles(node);
    if (filter && !allFiles.some(function(f) { return f.path.toLowerCase().indexOf(filter) !== -1; })) return;

    var key = fullPath;
    var isOpen = filter ? true : !!state.expanded[key];

    var header = document.createElement('div');
    header.className = 'section-header';
    header.style.paddingLeft = (12 + depth * 16) + 'px';
    header.innerHTML =
      '<span class="section-chevron ' + (isOpen ? '' : 'collapsed') + '">' +

    var itemsEl = document.createElement('div');
    itemsEl.className = 'section-items';

    // Sub-directories first

      renderDir(itemsEl, sub, node._dirs[sub], fullPath + '/' + sub, depth + 1, filter);
    });

    // Then files
    node._files.sort(function(a, b) { return a.name.localeCompare(b.name); })
    .forEach(function(f) {
      if (filter && f.path.toLowerCase().indexOf(filter) === -1) return;
      itemsEl.appendChild(buildFileItem(f, depth + 1));
    });

    parent.appendChild(itemsEl);
  }

  function collectFiles(node) {
    var result = node._files.slice();
    Object.keys(node._dirs).forEach(function(k) {

    return result;
  }

  function buildFileItem(item, depth) {

    el.className = 'file-item';
    el.style.paddingLeft = (28 + (depth || 0) * 16) + 'px';

    $('#code-header').style.display = 'flex';
    $('#code-view').style.display = 'none';
    $('#source-editor').style.display = 'none';
    $('#markdown-view').style.display = 'none';

    }

    $('#file-meta').textContent = 'Loading...';

      .catch(function(err) {

          $('#source-editor').style.display = 'block';

  function findEntry(path) {
    if (!state.manifest) return null;
    for (var i = 0; i < state.manifest.length; i++) {
      if (state.manifest[i].path === path) return state.manifest[i];
    }
    return null;
  }

  function displayFile(path, data) {

    // Notify chatbot sidebar
    setTreeSelection('file', data.name, path, data.content);

    $('#file-name').textContent = data.name;
    $('#file-meta').textContent = formatSize(data.size);
    $('#source-editor').value = data.content;
    $('#source-editor').scrollTop = 0;
    $('#source-editor').selectionStart = 0;
    $('#source-editor').selectionEnd = 0;

  function parseFrontmatter(content) {

    var lines = match[1].split('\n');
    var pairs = [];
    lines.forEach(function(line) {
      var idx = line.indexOf(':');
      if (idx > 0) {
        pairs.push({ key: line.substring(0, idx).trim(), value: line.substring(idx + 1).trim() });
      }

    return { frontmatter: pairs.length ? pairs : null, body: content.substring(match[0].length) };
  }

  function renderFrontmatterBlock(pairs) {
    var html = '<div class="frontmatter-block">';
    pairs.forEach(function(p) {
      html += '<div class="fm-row"><span class="fm-key">' + esc(p.key) + '</span><span class="fm-val">' + esc(p.value) + '</span></div>';
    });
    html += '</div>';
    return html;
  }

  function renderMarkdown(content) {
    var view = $('#markdown-view');
    if (typeof marked !== 'undefined') {
      var parsed = parseFrontmatter(content);
      var fmHtml = parsed.frontmatter ? renderFrontmatterBlock(parsed.frontmatter) : '';
      view.innerHTML = fmHtml + marked.parse(parsed.body, { breaks: true, gfm: true });
    } else {
      view.innerHTML = '<pre>' + esc(content) + '</pre>';
    }
  }

  function renderHighlighted(content, language) {
    var codeEl = $('#code-view').querySelector('code');
    var prismLang = PRISM_LANG[language] || 'text';
    codeEl.className = 'language-' + prismLang;
    codeEl.textContent = content;
    if (Prism.languages[prismLang]) Prism.highlightElement(codeEl);
  }

  function setView(view) {
    state.currentView = view;
    $$('#view-toggle button').forEach(function(b) {
      b.classList.toggle('active', b.dataset.view === view);
    });
    $('#code-view').style.display = view === 'highlighted' ? 'block' : 'none';
    $('#source-editor').style.display = view === 'source' ? 'block' : 'none';
    $('#markdown-view').style.display = view === 'rendered' ? 'block' : 'none';

    if (view === 'source') {
      requestAnimationFrame(function() {
        var ed = $('#source-editor');
        ed.scrollTop = 0;
        ed.selectionStart = 0;
        ed.selectionEnd = 0;
        ed.focus();
      });
    }
  }

  /* ── Local edit tracking ────────────────────────────────────────────── */
  function scheduleSave() {
    state.dirty = true;
    showStatus('modified');
  }

  function doSave() {
    if (!state.currentFile || !state.dirty) return;
    var content = $('#source-editor').value;
    state.dirty = false;
    if (state.currentFileData) state.currentFileData.content = content;
    if (_contentCache[state.currentFile]) _contentCache[state.currentFile].content = content;
    if (state.currentFileData && state.currentFileData.language === 'markdown') renderMarkdown(content);
    else if (state.currentView === 'highlighted' && state.currentFileData) renderHighlighted(content, state.currentFileData.language);

  function showStatus(type) {
    var el = $('#status-indicator');
    if (type === 'modified') el.innerHTML = '<span class="dot modified"></span> Edited (local)';

  (function() {

      if (!dragging) return;
      var w = startW + (e.clientX - startX);
      if (w >= 200 && w <= 420) {
        sidebar.style.width = w + 'px';

        if (ta.style.display !== 'none') {

    });
    document.addEventListener('mouseup', function() {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  })();

  /* ── Events ─────────────────────────────────────────────────────────── */
  $('#search-input').addEventListener('input', function() {
    renderSidebar(this.value.trim() || undefined);
  });
  $('#search-input').addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { this.value = ''; renderSidebar(); this.blur(); }
  });
  $('#view-toggle').addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (btn && btn.dataset.view) setView(btn.dataset.view);
  });
  $('#source-editor').addEventListener('input', scheduleSave);
  $('#source-editor').addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var ta = e.target;
      var s = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.substring(0, s) + '    ' + ta.value.substring(end);
      ta.selectionStart = ta.selectionEnd = s + 4;
      scheduleSave();
    }
  });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); doSave(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'p') { e.preventDefault(); $('#search-input').focus(); $('#search-input').select(); }
  });

  /* ── Public API for chatbot integration ─────────────────────────────── */
  window._skillsEditor = {
    openFile: function(path) {
      openFile(path);
      renderSidebar();
    },
    isReady: function() { return !!state.tree; }
  };

  /* ── Init ───────────────────────────────────────────────────────────── */
  localStorage.removeItem('interclaw-tree-selection');
  window.dispatchEvent(new CustomEvent('interclaw-tree-selection', { detail: null }));
  window.addEventListener('pagehide', function() {
    localStorage.removeItem('interclaw-tree-selection');
  });

  loadIndex();

  var openParam = new URLSearchParams(window.location.search).get('open');
  if (openParam) {
    var waitForLoad = setInterval(function() {
      if (state.tree) {
        clearInterval(waitForLoad);
        openFile(openParam);
        renderSidebar();
        history.replaceState(null, '', window.location.pathname);
      }
    }, 200);
  }

})();
</script>
</body>
</html>
